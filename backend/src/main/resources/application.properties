spring.application.name=vrum-backend

# Lê as variáveis de backend/.env (arquivo NÃO versionado), se existir.
# Variáveis definidas no terminal têm prioridade sobre o arquivo.
spring.config.import=optional:file:.env[.properties]

spring.datasource.url=${SUPABASE_DB_URL}
spring.datasource.username=${SUPABASE_DB_USER}
spring.datasource.password=${SUPABASE_DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
# O Session pooler do Supabase tem poucas conexões no plano gratuito.
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:5}

# Porta: o Render define PORT; localmente fica 8080.
server.port=${PORT:8080}
# Atrás do proxy HTTPS do Render: respeita X-Forwarded-* (esquema https, IP real).
server.forward-headers-strategy=framework

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=true

server.servlet.session.cookie.same-site=${SESSION_COOKIE_SAME_SITE:lax}
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}

app.setup-token=${APP_SETUP_TOKEN:}
app.cors.origins=${APP_CORS_ORIGINS:http://localhost:5173}
app.cadastro-agentes-publico=${APP_CADASTRO_AGENTES_PUBLICO:true}
