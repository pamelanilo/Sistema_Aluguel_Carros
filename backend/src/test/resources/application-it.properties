# Perfil "it" (integration test): banco H2 em memória, em modo compatível com PostgreSQL.
# Usado apenas pelos testes automatizados; a aplicação real usa o Supabase.
spring.datasource.url=jdbc:h2:mem:vrum;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create-drop
app.setup-token=token-de-teste
